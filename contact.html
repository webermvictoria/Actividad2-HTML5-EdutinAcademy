<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Contacta a English Pro para comenzar tus clases de inglés profesional.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="navbar md:navbar-expand site-navbar" aria-label="Navegación principal">
            <div class="container">
                <a class="navbar-brand fw-bold" href="initialpage.html">English Pro</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
                    <span class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
                </button>
                <dialog class="drawer drawer-end" tabindex="-1" id="menuPrincipal" aria-labelledby="tituloMenu">
                    <div class="drawer-header">
                        <h2 class="drawer-title" id="tituloMenu">Menú</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Cerrar menú"></button>
                    </div>
                    <div class="drawer-body">
                    <ul class="navbar-nav site-menu">
                        <li class="nav-item"><a class="nav-link" href="initialpage.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="service.html">Cursos</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html">Contacto</a></li>
                    </ul>
                    </div>
                </dialog>
            </div>
        </nav>
    </header>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="lg:col-8">
                <h1 class="page-title display-5">Comienza a aprender inglés</h1>
                <p class="lead">Cuéntanos tu profesión y el objetivo que quieres alcanzar con el idioma.</p>
                <form class="contact-form">
                    <div class="mb-3">
                        <label class="form-label" for="nombre">Nombre</label>
                        <input class="form-control" type="text" id="nombre" name="nombre" autocomplete="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="correo">Correo electrónico</label>
                        <input class="form-control" type="email" id="correo" name="correo" autocomplete="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="asunto">Profesión o área de trabajo</label>
                        <input class="form-control" type="text" id="asunto" name="asunto" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="mensaje">¿Qué te gustaría aprender?</label>
                        <textarea class="form-control" id="mensaje" name="mensaje" rows="5" required></textarea>
                    </div>
                    <button class="btn btn-accent btn-cta" type="submit">Solicitar información</button>
                </form>
            </div>
        </div>
    </main>
    <footer class="site-footer mt-5"><div class="container footer-content"><span>English Pro · Inglés para profesionales</span><address><a href="mailto:hola@englishpro.test">hola@englishpro.test</a> · <a href="tel:+541155550182">+54 11 5555 0182</a></address><small>&copy; 2026 English Pro</small></div></footer>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
